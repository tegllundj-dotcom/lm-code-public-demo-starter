<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="0; url=./demo-app/index.html" />
    <title>LM Code Public Demo Starter</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0f14;
        --panel: rgba(17, 23, 33, 0.9);
        --panel-border: rgba(148, 163, 184, 0.16);
        --text: #e5eef9;
        --muted: #97a3b6;
        --accent: #5eead4;
        --accent-strong: #14b8a6;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at top left, rgba(20, 184, 166, 0.24), transparent 34%),
          radial-gradient(circle at top right, rgba(59, 130, 246, 0.16), transparent 28%),
          linear-gradient(180deg, #0a0d12 0%, #070b10 100%);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(720px, 100%);
        border: 1px solid var(--panel-border);
        background: var(--panel);
        backdrop-filter: blur(14px);
        border-radius: 24px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
        padding: 32px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 18px 0 10px;
        font-size: clamp(2rem, 5vw, 3.5rem);
        line-height: 1.02;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
        font-size: 1rem;
      }

      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 24px;
      }

      a {
        text-decoration: none;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 999px;
        font-weight: 600;
        transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
      }

      .button.primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        color: #081318;
      }

      .button.secondary {
        border: 1px solid var(--panel-border);
        color: var(--text);
        background: rgba(255, 255, 255, 0.03);
      }

      .button:hover {
        transform: translateY(-1px);
      }

      .meta {
        display: grid;
        gap: 8px;
        margin-top: 22px;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .meta code {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">LM Code Public Demo</div>
      <h1>Click through to the public starter demo.</h1>
      <p>
        This page redirects to the standalone, mock-only demo experience. It is safe to share and does
        not connect to private project data.
      </p>
      <div class="actions">
        <a class="button primary" href="./demo-app/index.html">Open demo</a>
        <a class="button secondary" href="./README.md">View README</a>
      </div>
      <div class="meta">
        <div>Direct demo path: <code>demo-app/index.html</code></div>
        <div>Public repo: <code>lm-code-public-demo-starter</code></div>
      </div>
    </main>
    <script>
      setTimeout(() => {
        window.location.replace("./demo-app/index.html");
      }, 150);
    </script>
  </body>
</html>
